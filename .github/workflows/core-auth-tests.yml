name: core-auth tests

on:
  push:
    paths:
      - 'core-auth/**'
      - '.github/workflows/core-auth-tests.yml'
  pull_request:
    paths:
      - 'core-auth/**'
      - '.github/workflows/core-auth-tests.yml'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core-auth/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q --basetemp=.pytest-tmp
